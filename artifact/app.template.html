:focus-visible{outline:2.5px solid var(--ocean-2);outline-offset:2px;border-radius:6px}

/* ---- shell / layout ---- */
.app{min-height:100vh;display:flex;flex-direction:column}
.rail{display:none}
.main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:18px 16px 96px}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);

.brand .k{width:22px;height:22px;flex:none;align-self:center}
.brand b{font-family:var(--serif);font-size:1.06rem;letter-spacing:.01em}
.brand small{color:var(--muted);font-size:.72rem}
.topbar .sp{flex:1}
.iconbtn{background:transparent;border:1px solid var(--hair-2);color:var(--ink-2);
  border-radius:9px;padding:7px 10px;cursor:pointer;font-size:.82rem;display:inline-flex;gap:6px;align-items:center}
.iconbtn:hover{background:var(--surface-2)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;
  grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--hair);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;
  color:var(--muted);font-size:.62rem;font-weight:600;border-radius:8px;text-transform:uppercase;letter-spacing:.04em}
.tabbar a.on{color:var(--ocean)} .tabbar a.on svg{color:var(--ocean)}
.tabbar svg{width:21px;height:21px}
.more-sheet{position:fixed;inset:0;z-index:40;background:rgba(10,16,15,.35);display:flex;align-items:flex-end}
.more-sheet .card{width:100%;border-radius:16px 16px 0 0;padding:12px 14px 26px}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.more-grid a{padding:12px;border:1px solid var(--hair);border-radius:11px;color:var(--ink);
  display:flex;gap:9px;align-items:center;background:var(--raise)}

@media(min-width:900px){
  .app{flex-direction:row}
  .rail{display:flex;flex-direction:column;width:230px;flex:none;position:sticky;top:0;height:100vh;
    border-right:1px solid var(--hair);background:var(--surface);padding:16px 12px;gap:2px;overflow:auto}
  .rail .brand{padding:6px 8px 14px}
  .rail a.nav{display:flex;gap:11px;align-items:center;padding:9px 11px;border-radius:10px;
    color:var(--ink-2);font-weight:500;font-size:.9rem}
  .rail a.nav svg{width:19px;height:19px;color:var(--muted)}
  .rail a.nav:hover{background:var(--surface-2);text-decoration:none}
  .rail a.nav.on{background:var(--good-tint);color:var(--ocean)} .rail a.nav.on svg{color:var(--ocean)}
  .rail .grp{margin-top:12px;padding:4px 11px}
  .tabbar,.topbar{display:none}
  .main{padding:26px 30px 40px;max-width:none}

/* ---- primitives ---- */
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px} .pad-sm{padding:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}

.muted{color:var(--muted)} .ink2{color:var(--ink-2)}

.spacer{flex:1}

.btn{background:var(--ocean);color:#fff;border:1px solid transparent;border-radius:10px;

.chip .dot{width:7px;height:7px;border-radius:2px;flex:none} /* square-ish: shape carries meaning too */
.chip.good{background:var(--good-tint);border-color:transparent;color:var(--good)} .chip.good .dot{background:var(--good);border-radius:2px}
.chip.warn{background:var(--warn-tint);border-color:transparent;color:var(--kowhai)} .chip.warn .dot{background:var(--kowhai);border-radius:50%}
.chip.bad{background:var(--bad-tint);border-color:transparent;color:var(--bad)} .chip.bad .dot{background:var(--bad);transform:rotate(45deg)}
.chip.neutral{background:var(--neutral-tint);color:var(--ink-2)} .chip.neutral .dot{background:var(--neutral)}
.chip.unknown{background:transparent;border-style:dashed;color:var(--muted)} .chip.unknown .dot{background:transparent;border:1.5px solid var(--muted);border-radius:50%}
.chip.solid{background:var(--ocean);color:#fff;border-color:transparent}

.tag{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--hair)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);font-size:.84rem} .kv .v{font-weight:600;text-align:right}

table.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
table.tbl th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--hair-2);position:sticky;top:0;background:var(--surface)}

table.tbl tr:hover td{background:var(--surface-2)}
.scroll-x{overflow-x:auto}

label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--ink-2);font-weight:600}

.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(8,14,13,.45);display:flex;
  align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--hair);border-radius:16px;
  width:100%;max-width:720px;margin:24px auto;box-shadow:var(--shadow)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);border-radius:16px 16px 0 0;z-index:2}
.modal .mb{padding:18px}

.decision-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dcell{border:1px solid var(--hair);border-radius:12px;padding:12px;background:var(--raise);min-width:0}
.dcell .lab{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.dcell .big{font-family:var(--serif);font-size:1.18rem;margin-top:6px;line-height:1.1}
.dcell .sub{font-size:.76rem;color:var(--ink-2);margin-top:3px}

.dim{border:1px solid var(--hair);border-radius:11px;overflow:hidden}
.dim > .hd{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;background:var(--raise)}
.dim > .hd:hover{background:var(--surface-2)}
.dim .bd{padding:0 13px 13px;font-size:.88rem;color:var(--ink-2)}
.score-pill{font-family:var(--mono);font-weight:600;font-size:.8rem;padding:2px 8px;border-radius:7px;background:var(--surface-2);border:1px solid var(--hair-2)}
.delta-up{color:var(--good);font-weight:600} .delta-dn{color:var(--bad);font-weight:600}

.zone{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px;font-size:.74rem;max-width:420px}

.zone .cell.on{outline:2.5px solid var(--ocean);background:var(--good-tint)}
.zone .axl{display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;font-size:.64rem;text-transform:uppercase;letter-spacing:.05em}

.banner{border-radius:11px;padding:11px 13px;font-size:.85rem;border:1px solid var(--hair-2);background:var(--surface-2)}
.banner.warn{background:var(--warn-tint);border-color:transparent;color:#7a5a10}
.banner.bad{background:var(--bad-tint);border-color:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner.warn{color:var(--kowhai)}}
:root[data-theme="dark"] .banner.warn{color:var(--kowhai)}

.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.kbadge{font-size:.6rem;background:var(--kowhai-tint);color:#6a4d08;border-radius:6px;padding:2px 6px;font-weight:700;letter-spacing:.03em}
:root[data-theme="dark"] .kbadge, :root:not([data-theme="light"]) .kbadge{color:var(--kowhai)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kbadge{color:var(--kowhai)}}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);
  color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.85rem;box-shadow:var(--shadow);max-width:90vw}
@media(min-width:900px){.toast{bottom:24px}}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--hair),var(--surface-2));

@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.link-btn{background:none;border:0;color:var(--link);cursor:pointer;padding:0;font:inherit}
.ic{width:18px;height:18px;flex:none;vertical-align:middle}
.btn .ic{width:16px;height:16px}
.link-btn.row .ic{width:15px;height:15px}
.aibox{border:1px dashed var(--pounamu-2);border-radius:11px;padding:12px;background:color-mix(in srgb,var(--good-tint) 55%,transparent)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
progress{width:100%;height:8px}
</style>

/* ------------------------------------------------------------------ store */
/* db capability with a localStorage fallback so the app also runs in preview. */
const COLLS=["securities","snapshots","alerts","events","reviews","framework_versions"];
const LS="ti:";
function lsGet(c){ try{return JSON.parse(localStorage.getItem(LS+c)||"[]");}catch(e){return [];} }
function lsSet(c,arr){ try{localStorage.setItem(LS+c,JSON.stringify(arr));}catch(e){} }
function lsMetaGet(){ try{return JSON.parse(localStorage.getItem(LS+"meta")||"{}");}catch(e){return {};} }
function lsMetaSet(o){ try{localStorage.setItem(LS+"meta",JSON.stringify(o));}catch(e){} }

async function makeStore(){
  let db=null;
  try{ if(window.claude&&window.claude.use){ db=await window.claude.use("db"); } }catch(e){ db=null; }
  const backend = db ? "db" : "local";
  async function listAll(c){
    if(db){ try{ const s=await db.collection(c).limit(1000).get(); return s.docs.map(d=>({id:d.id,...d.data()})); }catch(e){ return []; } }
    return lsGet(c);
  }
  async function put(c,id,data){
    const doc={...data,id};
    if(db){ await db.collection(c).doc(id).set(doc); }
    else { const a=lsGet(c).filter(x=>x.id!==id); a.push(doc); lsSet(c,a); }
    return doc;
  }
  async function remove(c,id){
    if(db){ await db.collection(c).doc(id).delete(); }
    else { lsSet(c,lsGet(c).filter(x=>x.id!==id)); }
  }
  async function getMeta(){
    if(db){ try{ const d=await db.doc("meta/app").get(); return d.exists?d.data():{}; }catch(e){ return {}; } }
    return lsMetaGet();
  }
  async function setMeta(o){
    if(db){ await db.doc("meta/app").set({...o}); } else { lsMetaSet(o); }
  }
  return {backend,listAll,put,remove,getMeta,setMeta};
}

/* ------------------------------------------------------------------ derive an analysis result from a snapshot's inputs (deterministic) */
function deriveSnapshot(inputs, activeFw, security){
  // inputs: {dimB:{}, coreA:{}, gates:{}, temporal, structural, irrational, signals:[6], flow_condition, confidence, ...}
  const weights={}; (activeFw.dimensions||PROFILE_B_DIMS).forEach(d=>weights[d.key]=d.weight);
  const q=E.weightedScore(inputs.dimB||{},weights,5);
  const core=E.coreScorecardTotal(inputs.coreA||{});
  const liq=E.liquidityHardFlag(inputs.coreA||{});
  const gateArr=(activeFw.gates||DEFAULT_GATES).map(g=>({name:g.key,label:g.label,status:(inputs.gates||{})[g.key]||"UNKNOWN"}));
  const gate=E.hardGateStatus(gateArr);
  const six=E.sixSignalScore(inputs.signals||[]);
  const qualityOk = gate.overall!=="FAIL" && (q.score==null||q.score>=55);
  const integ=E.marketContextIntegration(qualityOk, six.favourable);
  const price=security&&security.price?num(security.price.current):null;
  const band=E.findBand((security&&security.entry_bands)||[], price);
  const entryStance=band?band.stance:null;
  const qAxis=E.qualityAxis(q.score, (activeFw.quality_high_threshold||60));
  const zone=E.decisionZone(qAxis==="UNKNOWN"?"LOW":qAxis, E.flowAxis(inputs.flow_condition));
  return {
    quality_score:q.score, quality_complete:q.complete, quality_missing:q.missing,
    core_total:core.total, core_band:core.band, core_complete:core.complete,
    liquidity_flag:liq.flag, gates:gateArr, gate_overall:gate.overall, deployable:gate.deployable,
    six:six, integration:integ, entry_stance:entryStance, entry_band_name:band?band.name:null,
    decision_zone:zone, quality_axis:qAxis
  };
}

function AppProvider({children}){

  const notify=useCallback((m)=>{ setToast(m); setTimeout(()=>setToast(t=>t===m?null:t),2600); },[]);

  useEffect(()=>{ (async()=>{

    const smp=await getSample(); setHasSample(!!smp);
    let m=await s.getMeta();
    let fws=await s.listAll("framework_versions");

      const a={id:uid(),name:"Core LLM Decision-Support Scorecard",profile:"A",version:1,created_at:nowIso(),superseded_at:null,
        core_categories:CORE_A_CATS.map(c=>({key:c[0],label:c[1],max:5})), note:"Explicit 40-point scorecard."};

      await s.put("framework_versions",a.id,a); await s.put("framework_versions",b.id,b);
      m={...m,seeded:true,active_fw:b.id,base_ccy:m.base_ccy||"NZD",move_threshold:0.05,redact_positions:false,theme:m.theme||"system"};
      await s.setMeta(m);

    setSecurities(secs); setSnapshots(snaps); setAlerts(al); setEvents(ev); setFrameworks(fws); setMetaState(m);

  })(); },[]);

  const activeFw=useMemo(()=> frameworks.find(f=>f.id===meta.active_fw) || frameworks.find(f=>f.profile==="B") || frameworks[0] || {dimensions:PROFILE_B_DIMS,gates:DEFAULT_GATES}, [frameworks,meta]);

  /* mutations ---------------------------------------------------------- */
  const saveSecurity=useCallback(async(sec)=>{
    const rec={...sec, id:sec.id||uid(), updated_at:nowIso(), created_at:sec.created_at||nowIso()};
    await store.put("securities",rec.id,rec);
    setSecurities(list=> { const o=list.filter(x=>x.id!==rec.id); o.push(rec); return o; });
    return rec;
  },[store]);

  const deleteSecurity=useCallback(async(id)=>{
    await store.remove("securities",id);
    setSecurities(l=>l.filter(x=>x.id!==id));
  },[store]);

  const pushAlert=useCallback(async(a)=>{
    const rec={...a,id:uid(),created_at:nowIso(),read:false};
    // dedupe against existing alerts (this session where relevant)
    const existing=alertsRef.current;
    if(E.isDuplicateAlert(rec, existing)) return null;
    await store.put("alerts",rec.id,rec);
    setAlerts(l=>[rec,...l]);
    return rec;
  },[store]);
  const alertsRef=useRef([]); useEffect(()=>{alertsRef.current=alerts;},[alerts]);

  const markAlert=useCallback(async(id,read)=>{
    const a=alertsRef.current.find(x=>x.id===id); if(!a)return;
    const rec={...a,read:read}; await store.put("alerts",id,rec);
    setAlerts(l=>l.map(x=>x.id===id?rec:x));
  },[store]);
  const deleteAlert=useCallback(async(id)=>{ await store.remove("alerts",id); setAlerts(l=>l.filter(x=>x.id!==id)); },[store]);

  const saveSnapshot=useCallback(async(snap)=>{
    const rec={...snap,id:snap.id||uid(),as_of:snap.as_of||nowIso(),created_at:nowIso()};
    await store.put("snapshots",rec.id,rec);
    setSnapshots(l=>[rec,...l]);
    return rec;
  },[store]);

  const saveEvent=useCallback(async(ev)=>{
    const rec={...ev,id:ev.id||uid(),created_at:nowIso()};
    await store.put("events",rec.id,rec);
    setEvents(l=>[rec,...l]);
    return rec;
  },[store]);
  const deleteEvent=useCallback(async(id)=>{ await store.remove("events",id); setEvents(l=>l.filter(x=>x.id!==id)); },[store]);

  const saveFramework=useCallback(async(fw)=>{
    await store.put("framework_versions",fw.id,fw);
    setFrameworks(l=>{const o=l.filter(x=>x.id!==fw.id);o.push(fw);return o;});
    return fw;
  },[store]);

  const updateMeta=useCallback(async(patch)=>{
    const m={...metaRef.current,...patch}; await store.setMeta(m); setMetaState(m); return m;
  },[store]);
  const metaRef=useRef({}); useEffect(()=>{metaRef.current=meta;},[meta]);

  // Bulk import (Sharesies): optionally clear demo data, upsert securities by
  // EXCHANGE:TICKER preserving any existing research, and merge a meta patch.
  const bulkImport=useCallback(async(built,clearDemo)=>{
    const current=securitiesRef.current.slice();
    let kept=current;
    if(clearDemo){
      const demo=current.filter(s=>s.example);
      for(const d of demo){
        await store.remove("securities",d.id);
        for(const sn of snapshotsRef.current.filter(x=>x.security_id===d.id)) await store.remove("snapshots",sn.id);
      }
      kept=current.filter(s=>!s.example);
      setSnapshots(l=>l.filter(sn=>!demo.some(d=>d.id===sn.security_id)));
    }
    const byKey={}; kept.forEach(s=>{byKey[secKey(s)]=s;});
    const out=[];
    for(const inc of built.securities){
      const key=(inc.exchange||"?")+":"+(inc.ticker||"?");
      const existing=byKey[key];
      // preserve research (thesis/latest/snapshots/analysis/role/tier) on an existing security
      const rec=existing
        ? {...existing, name:inc.name||existing.name, currency:inc.currency||existing.currency, asset_type:inc.asset_type||existing.asset_type,
           price:{...(existing.price||{}),...inc.price}, holding:inc.holding, transactions:inc.transactions, sharesies:inc.sharesies,
           imported:true, source:"sharesies", updated_at:nowIso()}
        : {...inc, id:uid(), created_at:nowIso(), updated_at:nowIso(), last_band:null, latest:{
            entry_classification:null, thesis_status:null }};
      await store.put("securities",rec.id,rec);
      out.push(rec);
    }
    // rebuild securities state: kept (minus upserted keys) + upserted
    const upsertKeys={}; out.forEach(r=>upsertKeys[secKey(r)]=true);
    const merged=kept.filter(s=>!upsertKeys[secKey(s)]).concat(out);
    setSecurities(merged);
    if(built.metaPatch) await updateMeta(built.metaPatch);
    return out.length;
  },[store,updateMeta]);
  const securitiesRef=useRef([]); useEffect(()=>{securitiesRef.current=securities;},[securities]);
  const snapshotsRef=useRef([]); useEffect(()=>{snapshotsRef.current=snapshots;},[snapshots]);

  const value={backend,securities,snapshots,alerts,events,frameworks,meta,activeFw,booting,notify,hasSample,
    saveSecurity,deleteSecurity,pushAlert,markAlert,deleteAlert,saveSnapshot,saveEvent,deleteEvent,saveFramework,updateMeta,bulkImport,store};

  return html`<${Ctx.Provider} value=${value}>
    ${children}
    ${toast&&html`<div class="toast" role="status">${toast}</div>`}
  </${Ctx.Provider}>`;
}

function Chip({kind,children,title}){ return html`<span class="chip ${kind||''}" title=${title||''}><span class="dot"></span>${children}</span>`; }
function statusKind(s){
  const g=["PASS","GOOD_ENTRY","STRONG_STRUCTURAL","TOO_PESSIMISTIC","STRONG_TIMING","INTACT","STRENGTHENED","CONFIRMED","BEST","STRONG_CANDIDATE","IMPROVING_ENTRY","FAVOURABLE","QUALITY_IMPROVEMENT","THESIS_CONFIRMATION","PRICE_ONLY_ENTRY_IMPROVEMENT","STRONG_ENTRY","STARTER"];
  const w=["REVIEW","NEUTRAL","MIXED","FAIR","ACCEPTABLE_CONSERVATIVE_SIZE","PATIENCE","WATCHLIST_OR_STAGED","WAIT","ACCEPTABLE","STOP_ADDING","WATCHLIST_NOT_CHASE"];
  const b=["FAIL","BAD_ENTRY_WAIT","CYCLICAL_ONLY","TOO_OPTIMISTIC","WATCH_WAIT","DAMAGED","BROKEN","AVOID","AVOID_OR_KEEP_SMALL","DETERIORATING_ENTRY","UNFAVOURABLE","QUALITY_DETERIORATION","THESIS_DAMAGE","PRICE_ONLY_ENTRY_DETERIORATION","AVOID_CHASING","HIGH_LIQUIDITY_RISK","VALUE_TRAP_OR_TRADING_ONLY"];
  if(s==null||s==="UNKNOWN")return "unknown";
  if(g.includes(s))return "good"; if(w.includes(s))return "warn"; if(b.includes(s))return "bad";
  if(s==="NOT_APPLICABLE")return "neutral"; return "neutral";
}

/* ------- SVG charts (theme-token colours) ------- */
function EntryBandChart({bands,price,ccy}){
  if(!bands||!bands.length)return html`<div class="muted small">No entry bands set.</div>`;
  const vals=[]; bands.forEach(b=>{ if(b.lower_bound!=null)vals.push(+b.lower_bound); if(b.upper_bound!=null)vals.push(+b.upper_bound); });
  if(price!=null)vals.push(price);
  let lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals); if(lo===hi){lo=lo*0.9;hi=hi*1.1;}
  const pad=(hi-lo)*0.08; lo-=pad; hi+=pad;
  const W=560,H=74,L=8,R=8,top=16,bh=26; const sx=(v)=> L+((v-lo)/(hi-lo))*(W-L-R);
  const cols={STRONG_ENTRY:"var(--good)",STARTER:"var(--pounamu-2)",ACCEPTABLE:"var(--kowhai)",WAIT:"var(--neutral)",AVOID_CHASING:"var(--bad)"};
  const order=[...bands].sort((a,b)=>((a.lower_bound==null?-1e9:a.lower_bound)-(b.lower_bound==null?-1e9:b.lower_bound)));
  return html`<div class="scroll-x"><svg viewBox="0 0 ${W} ${H}" width="100%" style=${{maxWidth:W+"px"}} role="img" aria-label="Entry bands with current price">
    ${order.map((b,i)=>{ const x1=sx(b.lower_bound==null?lo:+b.lower_bound), x2=sx(b.upper_bound==null?hi:+b.upper_bound);
      return html`<g key=${i}><rect x=${x1} y=${top} width=${Math.max(1,x2-x1)} height=${bh} fill=${cols[b.stance]||'var(--neutral)'} opacity="0.5"/>
        <text x=${(x1+x2)/2} y=${top+bh+13} fill="var(--muted)" font-size="8.5" text-anchor="middle" font-family="var(--mono)">${titleCase(b.stance)}</text></g>`; })}
    ${price!=null&&html`<g><line x1=${sx(price)} y1=${top-6} x2=${sx(price)} y2=${top+bh+6} stroke="var(--ink)" stroke-width="2"/>
      <polygon points="${sx(price)-4},${top-6} ${sx(price)+4},${top-6} ${sx(price)},${top-1}" fill="var(--ink)"/>
      <text x=${sx(price)} y=${top-9} fill="var(--ink)" font-size="9.5" text-anchor="middle" font-family="var(--mono)" font-weight="600">${ccy||''} ${fmtNum(price,2)}</text></g>`}
  </svg></div>`;
}
function PriceChart({history,bands,events}){
  if(!history||history.length<2)return html`<div class="muted small">Not enough price points to chart. Add prices on this security.</div>`;
  const H=180,W=560,L=44,R=10,T=12,B=24;
  const xs=history.map((p,i)=>i), ys=history.map(p=>+p.close);
  let lo=Math.min.apply(null,ys),hi=Math.max.apply(null,ys);
  if(bands){bands.forEach(b=>{if(b.lower_bound!=null){lo=Math.min(lo,+b.lower_bound);hi=Math.max(hi,+b.lower_bound);}if(b.upper_bound!=null){lo=Math.min(lo,+b.upper_bound);hi=Math.max(hi,+b.upper_bound);}});}
  const pad=(hi-lo)*0.08||1; lo-=pad;hi+=pad;
  const sx=(i)=> L+(i/(xs.length-1))*(W-L-R), sy=(v)=> T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const path=history.map((p,i)=>(i?"L":"M")+sx(i).toFixed(1)+" "+sy(+p.close).toFixed(1)).join(" ");
  const area=path+` L ${sx(xs.length-1)} ${H-B} L ${sx(0)} ${H-B} Z`;
  const cols={STRONG_ENTRY:"var(--good)",STARTER:"var(--pounamu-2)",ACCEPTABLE:"var(--kowhai)",WAIT:"var(--neutral)",AVOID_CHASING:"var(--bad)"};
  const ticks=4; const tk=[];for(let i=0;i<=ticks;i++)tk.push(lo+(hi-lo)*i/ticks);
  return html`<div class="scroll-x"><svg viewBox="0 0 ${W} ${H}" width="100%" style=${{maxWidth:W+"px"}} role="img" aria-label="Price history with entry bands">
    ${tk.map((v,i)=>html`<g key=${i}><line x1=${L} y1=${sy(v)} x2=${W-R} y2=${sy(v)} stroke="var(--hair)" stroke-width="1"/>
      <text x=${L-6} y=${sy(v)+3} fill="var(--muted)" font-size="8.5" text-anchor="end" font-family="var(--mono)">${fmtNum(v,0)}</text></g>`)}
    ${(bands||[]).map((b,i)=> (b.lower_bound!=null||b.upper_bound!=null) ? html`<line key=${'b'+i} x1=${L} x2=${W-R} y1=${sy(b.upper_bound!=null?+b.upper_bound:+b.lower_bound)} y2=${sy(b.upper_bound!=null?+b.upper_bound:+b.lower_bound)} stroke=${cols[b.stance]||'var(--neutral)'} stroke-dasharray="3 3" stroke-width="1" opacity="0.8"/>` : null)}
    <path d=${area} fill="var(--ocean)" opacity="0.10"/>
    <path d=${path} fill="none" stroke="var(--ocean)" stroke-width="2"/>
    <circle cx=${sx(xs.length-1)} cy=${sy(+history[history.length-1].close)} r="3.2" fill="var(--ocean)"/>
    <text x=${L} y=${H-8} fill="var(--muted)" font-size="8.5" font-family="var(--mono)">${history[0].date||''}</text>
    <text x=${W-R} y=${H-8} fill="var(--muted)" font-size="8.5" text-anchor="end" font-family="var(--mono)">${history[history.length-1].date||''}</text>
  </svg></div>`;
}
function Donut({data}){ // data:[{label,value,color}]
  const total=data.reduce((s,d)=>s+d.value,0)||1; let a=-Math.PI/2; const R=52,r=32,C=60;
  const seg=data.map((d,i)=>{ const frac=d.value/total; const a2=a+frac*2*Math.PI;
    const x1=C+R*Math.cos(a),y1=C+R*Math.sin(a),x2=C+R*Math.cos(a2),y2=C+R*Math.sin(a2);
    const x3=C+r*Math.cos(a2),y3=C+r*Math.sin(a2),x4=C+r*Math.cos(a),y4=C+r*Math.sin(a);
    const large=frac>0.5?1:0; a=a2;
    return html`<path key=${i} d="M${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 ${large} 0 ${x4} ${y4} Z" fill=${d.color}/>`; });
  return html`<div class="row" style=${{gap:"16px",flexWrap:"wrap"}}>
    <svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Allocation">${seg}</svg>
    <div class="stack" style=${{gap:"4px"}}>${data.map((d,i)=>html`<div key=${i} class="row xs"><span style=${{width:"10px",height:"10px",background:d.color,borderRadius:"3px"}}></span><span class="muted">${d.label}</span><b class="mono">${fmtNum(d.value,0)}</b></div>`)}</div>
  </div>`;
}
function LineChart({points,ccy}){ // points:[{date,value}]
  if(!points||points.length<2)return html`<div class="muted small">No value history.</div>`;
  const H=170,W=620,L=52,R=12,T=14,B=26;
  const ys=points.map(p=>+p.value); let lo=Math.min.apply(null,ys),hi=Math.max.apply(null,ys);
  const pad=(hi-lo)*0.08||1; lo=Math.max(0,lo-pad); hi+=pad;
  const sx=(i)=>L+(i/(points.length-1))*(W-L-R), sy=(v)=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const path=points.map((p,i)=>(i?"L":"M")+sx(i).toFixed(1)+" "+sy(+p.value).toFixed(1)).join(" ");
  const area=path+` L ${sx(points.length-1)} ${H-B} L ${sx(0)} ${H-B} Z`;
  const ticks=4,tk=[];for(let i=0;i<=ticks;i++)tk.push(lo+(hi-lo)*i/ticks);
  return html`<div class="scroll-x"><svg viewBox="0 0 ${W} ${H}" width="100%" style=${{maxWidth:W+"px"}} role="img" aria-label="Portfolio value over time">
    ${tk.map((v,i)=>html`<g key=${i}><line x1=${L} y1=${sy(v)} x2=${W-R} y2=${sy(v)} stroke="var(--hair)" stroke-width="1"/>
      <text x=${L-6} y=${sy(v)+3} fill="var(--muted)" font-size="9" text-anchor="end" font-family="var(--mono)">${fmtNum(v,0)}</text></g>`)}
    <path d=${area} fill="var(--ocean)" opacity="0.10"/>
    <path d=${path} fill="none" stroke="var(--ocean)" stroke-width="2"/>
    <circle cx=${sx(points.length-1)} cy=${sy(+points[points.length-1].value)} r="3.2" fill="var(--ocean)"/>
    <text x=${L} y=${H-8} fill="var(--muted)" font-size="9" font-family="var(--mono)">${points[0].date||''}</text>
    <text x=${W-R} y=${H-8} fill="var(--muted)" font-size="9" text-anchor="end" font-family="var(--mono)">${points[points.length-1].date||''}</text>
  </svg></div>`;
}

function candidateFromSec(s){
  const l=s.latest||{};
  return {id:s.id,sec:s,name:secKey(s),hard_gate_status:l.gate_overall||"UNKNOWN",
    quality_score:l.quality_score!=null?E.confidenceAdjustedQuality(l.quality_score,l.confidence):null,
    raw_quality:l.quality_score,entry_score:l.entry_rank!=null?l.entry_rank*20:null,
    market_context_score:l.six!=null?l.six.favourable*16.6:null,liquidity_risk:l.liquidity_flag?3:0,
    portfolio_fit:0,confidence:l.confidence};
}
function needsAttention(app){
  const out=[];
  app.securities.forEach(s=>{
    const l=s.latest||{};
    const recentAlerts=app.alerts.filter(a=>a.security_id===s.id&&!a.read);
    recentAlerts.forEach(a=>out.push({sec:s,kind:a.type,reason:a.title,pri:a.type==="BAND_CROSSING"?5:a.type==="MATERIAL_EVENT"?4:a.type==="THESIS_GATE"?4:a.type==="DAILY_MOVE"?3:2,ts:a.created_at}));
    const dsa=daysSince(l.as_of); if(dsa!=null&&dsa>90&&l.quality_score!=null)out.push({sec:s,kind:"STALE",reason:"Full assessment "+dsa+" days old",pri:1});
    // upcoming earnings
    app.events.filter(e=>e.security_id===s.id&&e.type==="EARNINGS"&&e.date&&new Date(e.date)>new Date()).forEach(e=>{
      const dd=Math.ceil((new Date(e.date)-Date.now())/86400000); if(dd<=21)out.push({sec:s,kind:"EARNINGS",reason:"Earnings in "+dd+"d",pri:2}); });
  });
  return out.sort((a,b)=>b.pri-a.pri).slice(0,8);
}

function DetailAI({s}){
  const app=useApp(); const [out,setOut]=useState(null); const [busy,setBusy]=useState(null); const [err,setErr]=useState(null);
  if(!app.hasSample)return html`<div class="card pad empty"><h3>AI research is optional and off</h3><p class="small">The deterministic scores above never need AI. If you open this page in Claude, AI-assisted interpretation (business summary, structural-vs-cyclical, red-team) becomes available and runs on your own Claude plan — no API key. It interprets evidence; it never sets the scores.</p></div>`;
  const run=async(kind)=>{
    setBusy(kind);setErr(null);setOut(null);
    try{
      const sample=await getSample(); if(!sample){setErr("AI unavailable in this view.");setBusy(null);return;}
      const ctx=aiContext(s,app.meta.redact_positions);
      const prompts={
        summary:{instr:"Summarise this company's business model and how it makes money in 3-4 sentences, and list its main economic exposures.",schema:'{"summary":"string","economic_exposures":["string"]}'},
        structural:{instr:"Classify the thesis drivers as structural vs cyclical. Explain briefly.",schema:'{"verdict":"STRUCTURAL|CYCLICAL|MIXED|UNKNOWN","reasoning":"string","structural_drivers":["string"],"cyclical_drivers":["string"]}'},
        redteam:{instr:"Red-team this investment thesis. What would make it wrong? Be specific and evidence-oriented.",schema:'{"key_risks":["string"],"what_would_make_it_wrong":["string"],"missing_information":["string"]}'},
      };
      const p=prompts[kind];
      const input="You are an investment research assistant. Interpret only the evidence given; if something is not provided, say it is unknown rather than inventing it. Return ONLY JSON matching: "+p.schema+"\n\nTask: "+p.instr+"\n\nSecurity data:\n"+ctx;
      const res=await sample.json(input,{modelTier:"default",cache:true});
      setOut({kind,data:res});
    }catch(e){ setErr((e&&e.message)||"AI request failed."); }
    setBusy(null);
  };
  return html`<div class="stack">
    <div class="aibox stack">
      <div class="between"><b>AI-assisted interpretation</b><span class="xs muted">Runs on your Claude plan · consent-gated</span></div>
      <div class="wrap-row">
        <button class="btn sm" disabled=${busy} onClick=${()=>run("summary")}>${busy==="summary"?"Thinking…":"Summarise business"}</button>
        <button class="btn sm" disabled=${busy} onClick=${()=>run("structural")}>${busy==="structural"?"Thinking…":"Structural vs cyclical"}</button>
        <button class="btn sm" disabled=${busy} onClick=${()=>run("redteam")}>${busy==="redteam"?"Thinking…":"Red-team thesis"}</button>
      </div>
      <div class="xs muted">AI interprets evidence and never sets the deterministic scores. ${app.meta.redact_positions?"Position sizes are redacted from AI context.":""}</div>
    </div>
    ${err&&html`<div class="banner bad small">${err}</div>`}
    ${out&&html`<div class="card pad"><pre style=${{whiteSpace:"pre-wrap",fontFamily:"var(--mono)",fontSize:".8rem",margin:0}}>${JSON.stringify(out.data,null,2)}</pre></div>`}
  </div>`;
}
function aiContext(s,redact){
  const l=s.latest||{}; const t=s.thesis&&s.thesis.active;
  const o={ticker:secKey(s),name:s.name,sector:s.sector,asset_type:s.asset_type,summary:s.summary,
    quality_score:l.quality_score,entry:l.entry_classification,thesis_status:l.thesis_status,
    thesis:t?{fundamental_reason:t.fundamental_reason,main_risk:t.main_risk,type:t.thesis_type}:null,
    market_context:l.market_context, price:s.price?{current:s.price.current}:null};
  if(!redact&&s.holding)o.holding=s.holding;
  return JSON.stringify(o,null,2);
}

/* ============================================================ Analysis form */
function AnalysisForm({s,onClose}){
  const app=useApp(); const fw=app.activeFw;
  const prev=app.snapshots.filter(x=>x.security_id===s.id).sort((a,b)=>new Date(b.as_of)-new Date(a.as_of))[0];
  const [dimB,setDimB]=useState({}); const [rationale,setRationale]=useState({});
  const [coreA,setCoreA]=useState({}); const [gates,setGates]=useState({});
  const [mc,setMc]=useState({temporal:"",structural:"",irrational:"",signals:["","","","","",""]});
  const [flow,setFlow]=useState("NEUTRAL"); const [confidence,setConfidence]=useState("MEDIUM");
  const [summary,setSummary]=useState(""); const [research,setResearch]=useState("");
  const derived=deriveSnapshot({dimB:mapNums(dimB),coreA:mapNums(coreA),gates,temporal:mc.temporal,structural:mc.structural,irrational:mc.irrational,signals:mc.signals,flow_condition:flow,confidence},fw,s);
  const save=async()=>{
    const dims=(fw.dimensions||PROFILE_B_DIMS).map(d=>({key:d.key,label:d.label,score:num(dimB[d.key]),rationale:rationale[d.key]||"",confidence}));
    const snap={security_id:s.id,framework_version_id:fw.id,analysis_type:"FULL_ASSESSMENT",as_of:nowIso(),
      quality_score:derived.quality_score,dimensions:dims,
      core_scores:mapNums(coreA),core_total:derived.core_total,core_band:derived.core_band,liquidity_flag:derived.liquidity_flag,
      gates:derived.gates,gate_overall:derived.gate_overall,
      market_context:{temporal:mc.temporal,structural:mc.structural,irrational:mc.irrational,signals:mc.signals},
      decision_zone:derived.decision_zone,entry_classification:derived.entry_stance,entry_band_name:derived.entry_band_name,
      thesis_status:(s.thesis&&s.thesis.active&&s.thesis.active.status)||"INTACT",confidence,summary,
      research_needed:research?research.split("\n").filter(Boolean):[]};
    const rec=await app.saveSnapshot(snap);
    // build latest summary + change detection vs prev
    const newLatest={quality_score:derived.quality_score,core_total:derived.core_total,core_band:derived.core_band,
      entry_classification:derived.entry_stance,entry_rank:E.entryRank(derived.entry_stance),entry_band_name:derived.entry_band_name,
      thesis_status:snap.thesis_status,decision_zone:derived.decision_zone,gate_overall:derived.gate_overall,liquidity_flag:derived.liquidity_flag,
      six:derived.six,integration:derived.integration,market_context:snap.market_context,confidence,framework_version_id:fw.id,snapshot_id:rec.id,as_of:snap.as_of};
    const change=E.classifyChange(
      prev?{quality_score:prev.quality_score,entry_classification:prev.entry_classification,thesis_status:prev.thesis_status}:null,
      {quality_score:derived.quality_score,entry_classification:derived.entry_stance,thesis_status:snap.thesis_status});
    const cl=(s.changelog||[]).slice(-99);
    if(!change.changes.includes("NO_MATERIAL_CHANGE")||!prev){
      cl.push({at:nowIso(),changes:change.changes,quality_changed:change.quality_changed,entry_changed:change.entry_changed,
        reason:prev?deltaReason(change,prev,derived):"First full assessment recorded."});
    }
    await app.saveSecurity({...s,latest:newLatest,changelog:cl,last_band:derived.entry_band_name});
    if(change.quality_changed){
      await app.pushAlert({security_id:s.id,security_key:secKey(s),type:"QUALITY_CHANGE",subtype:change.changes.join(","),
        title:secKey(s)+" · quality "+(change.changes.includes("QUALITY_IMPROVEMENT")?"improved":"changed"),
        old_state:prev?fmtNum(prev.quality_score,0):"—",new_state:fmtNum(derived.quality_score,0),
        quality_changed:true,entry_changed:change.entry_changed,rationale:deltaReason(change,prev,derived),next_action:"REASSESS"});
    }
    app.notify("Assessment saved"); onClose();
  };

function mapNums(o){const r={};Object.keys(o||{}).forEach(k=>{const n=num(o[k]);if(n!=null)r[k]=n;});return r;}
function deltaReason(change,prev,d){
  if(change.changes.includes("PRICE_ONLY_ENTRY_IMPROVEMENT"))return "Price moved into a better entry band; business-quality assessment unchanged.";
  if(change.changes.includes("PRICE_ONLY_ENTRY_DETERIORATION"))return "Price moved into a worse entry band; quality unchanged.";
  if(change.changes.includes("QUALITY_IMPROVEMENT"))return "Quality score rose to "+fmtNum(d.quality_score,0)+" from "+fmtNum(prev&&prev.quality_score,0)+".";
  if(change.changes.includes("QUALITY_DETERIORATION"))return "Quality score fell to "+fmtNum(d.quality_score,0)+" from "+fmtNum(prev&&prev.quality_score,0)+".";
  return "Reassessed; no material change.";
}

/* ============================================================ Price form (manual) */
function PriceForm({s,onClose}){
  const app=useApp(); const p=s.price||{};
  const [current,setCurrent]=useState(p.current!=null?String(p.current):"");
  const [prev,setPrev]=useState(p.prev_close!=null?String(p.prev_close):(p.current!=null?String(p.current):""));
  const [high,setHigh]=useState(p.high52w!=null?String(p.high52w):"");
  const [date,setDate]=useState(todayKey());
  const save=async()=>{
    const price=num(current); if(price==null){onClose();return;}
    const prevClose=num(prev); const history=(p.history||[]).slice(-499);
    if(!history.length||history[history.length-1].date!==date)history.push({date,close:price}); else history[history.length-1].close=price;
    const newPrice={current:price,prev_close:prevClose!=null?prevClose:p.current,high52w:num(high),as_of:nowIso(),provider:"manual",freshness:"MANUAL",history};
    // band crossing
    const crossing=E.detectBandCrossing(s.entry_bands||[], s.last_band||null, price);
    const move=E.dailyMovePct(newPrice.prev_close, price);
    const cl=(s.changelog||[]).slice(-99);
    let latest={...(s.latest||{})};
    if(crossing){
      latest.entry_classification=crossing.stance; latest.entry_rank=E.entryRank(crossing.stance); latest.entry_band_name=crossing.to;
      cl.push({at:nowIso(),changes:[crossing.direction==="IMPROVING_ENTRY"?"PRICE_ONLY_ENTRY_IMPROVEMENT":"PRICE_ONLY_ENTRY_DETERIORATION"],quality_changed:false,entry_changed:true,
        reason:"Price "+fmtMoney(price,s.currency,2)+": "+(crossing.from||"—")+" → "+crossing.to+". Quality unchanged."});
      await app.pushAlert({security_id:s.id,security_key:secKey(s),type:"BAND_CROSSING",direction:crossing.direction,band_to:crossing.to,
        title:secKey(s)+" · entry "+(crossing.from||"—")+" → "+crossing.to,current_price:price,
        old_state:crossing.from||"—",new_state:crossing.to,quality_changed:false,entry_changed:true,
        rationale:"Stored "+titleCase(crossing.stance)+" threshold crossed at "+fmtMoney(price,s.currency,2)+". No new company evidence changed the business-quality assessment.",
        affected_dimensions:["Valuation / margin of safety","Temporal market context"],next_action:"REVIEW"});
    } else {
      const band=E.findBand(s.entry_bands||[],price); if(band){latest.entry_classification=band.stance;latest.entry_rank=E.entryRank(band.stance);latest.entry_band_name=band.name;}
    }
    if(E.isBigDailyMove(newPrice.prev_close,price,app.meta.move_threshold||0.05)){
      await app.pushAlert({security_id:s.id,security_key:secKey(s),type:"DAILY_MOVE",session:date,move_pct:move,
        title:secKey(s)+" · "+fmtPct(move)+" on the day",current_price:price,old_state:fmtMoney(newPrice.prev_close,s.currency,2),new_state:fmtMoney(price,s.currency,2),
        quality_changed:false,entry_changed:!!crossing,rationale:"Daily move exceeded the "+((app.meta.move_threshold||0.05)*100)+"% threshold. Check for news before acting.",next_action:"REVIEW"});
    }
    await app.saveSecurity({...s,price:newPrice,last_band:crossing?crossing.to:(E.findBand(s.entry_bands||[],price)||{}).name||s.last_band,latest,changelog:cl});
    app.notify("Price updated"); onClose();
  };
  return html`<${Modal} title=${"Update price · "+secKey(s)} onClose=${onClose}>
    <div class="banner small" style=${{marginBottom:"12px"}}>Free hosted apps can't pull live exchange data, so prices are entered manually (or via CSV). Freshness is shown honestly as <b>Manual</b>.</div>
    <div class="form-grid">
      <${Field} label=${"Current price ("+(s.currency||"")+")"}><input inputmode="decimal" value=${current} onInput=${e=>setCurrent(e.target.value)}/></${Field}>
      <${Field} label="Previous close" hint="for daily-move detection"><input inputmode="decimal" value=${prev} onInput=${e=>setPrev(e.target.value)}/></${Field}>
      <${Field} label="52-week high" hint="optional, for drawdown"><input inputmode="decimal" value=${high} onInput=${e=>setHigh(e.target.value)}/></${Field}>
      <${Field} label="As of date"><input type="date" value=${date} onInput=${e=>setDate(e.target.value)}/></${Field}>
    </div>
    <div class="between" style=${{marginTop:"14px"}}><span class="xs muted">Band crossings & >${((app.meta.move_threshold||0.05)*100)}% moves create alerts (deduped).</span><button class="btn" onClick=${save}>Save price</button></div>
  </${Modal}>`;
}

  const total=rows.reduce((a,r)=>a+r.valB,0);

  const byRole={},byCcy={}; rows.forEach(r=>{byRole[r.s.role||"OTHER"]=(byRole[r.s.role||"OTHER"]||0)+r.valB;byCcy[r.s.currency||"?"]=(byCcy[r.s.currency||"?"]||0)+r.valB;});

  const hist=app.meta.portfolio_history;

      <div class="card pad"><div class="tag">Holdings value (${base})</div><div style=${{fontFamily:"var(--serif)",fontSize:"1.5rem"}}>${fmtMoney(total,base,0)}</div></div>
      <div class="card pad"><div class="tag">Cash / dry powder (${base})</div><div style=${{fontFamily:"var(--serif)",fontSize:"1.5rem"}}>${fmtMoney(cashBase,base,0)}</div>${cash&&html`<div class="xs muted mono">${Object.keys(cash).filter(c=>num(cash[c])).map(c=>c+" "+fmtNum(cash[c],2)).join(" · ")||"—"}</div>`}</div>
      <div class="card pad"><div class="tag">Dividends received (${base})</div><div style=${{fontFamily:"var(--serif)",fontSize:"1.5rem"}}>${fmtMoney(dividends,base,0)}</div><div class="xs muted">lifetime, per Sharesies</div></div>
    </div>
    ${hist&&hist.length>1&&html`<div class="card pad stack"><div class="between"><h3>Portfolio value over time</h3><span class="tag">${base} · from Sharesies</span></div><${LineChart} points=${hist} ccy=${base}/></div>`}
    <div class="grid" style=${{gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))"}}>
      <div class="card pad stack"><div class="tag">By role</div><${Donut} data=${Object.keys(byRole).map((r,i)=>({label:titleCase(r),value:byRole[r],color:cols[i%cols.length]}))}/></div>
      <div class="card pad stack"><div class="tag">By currency</div><${Donut} data=${Object.keys(byCcy).map((r,i)=>({label:r,value:byCcy[r],color:cols[i%cols.length]}))}/></div>
    </div>
    ${(fxMap.USD||fxMap.AUD)&&html`<div class="banner small">FX to ${base}${app.meta.fx_asof?" (latest from your wallet exchanges)":""}: ${Object.keys(fxMap).filter(c=>c!==base).map(c=>c+" "+fmtNum(fxMap[c],4)).join(" · ")}. Edit in Settings.</div>`}
    ${rows.length===0?html`<div class="card pad empty"><h3>No holdings</h3><p class="small">Import your Sharesies exports or add holdings on a security.</p><button class="btn" onClick=${()=>go("/portfolio/import")}>Import from Sharesies</button></div>`:
      html`<div class="card scroll-x"><table class="tbl"><thead><tr><th>Ticker</th><th>Role</th><th>Qty</th><th>Price</th><th>Value (native)</th><th>Value (${base})</th><th>P/L</th><th>Quality</th></tr></thead><tbody>
      ${rows.sort((a,b)=>b.valB-a.valB).map(r=>html`<tr key=${r.s.id} style=${{cursor:"pointer"}} onClick=${()=>go("/securities/"+r.s.id)}>
        <td><b class="mono">${secKey(r.s)}</b></td><td class="small muted">${titleCase(r.s.role||"—")}</td>
        <td class="mono">${fmtNum(r.q,0)}</td><td class="mono">${fmtMoney(r.cur,r.s.currency,2)}</td>
        <td class="mono">${fmtMoney(r.valN,r.s.currency,0)}</td><td class="mono">${fmtMoney(r.valB,base,0)}</td>
        <td class=${r.pl==null?'muted':r.pl>=0?'delta-up':'delta-dn'}>${r.pl==null?"—":fmtPct(r.pl)}</td>
        <td>${(r.s.latest&&r.s.latest.quality_score!=null)?html`<span class="score-pill">${fmtNum(r.s.latest.quality_score,0)}</span>`:"—"}</td></tr>`)}
      </tbody></table></div>`}
    <div class="card pad stack"><h3>Position sizing guidance</h3><div class="scroll-x"><table class="tbl"><thead><tr><th>Position type</th><th>Indicative size</th></tr></thead><tbody>${SIZE_GUIDE.map(r=>html`<tr key=${r[0]}><td>${r[0]}</td><td class="mono">${r[1]}</td></tr>`)}</tbody></table></div><div class="xs muted">User-editable defaults (§8.2).</div></div>

/* ============================================================ Portfolio import (Sharesies) */
const SLOT_LABELS={holdings:"Investment holdings report",transactions:"Transaction report",summary:"Holdings summary report",wallet:"Wallet report"};
const SLOT_ROLE={holdings:"Current positions, price & average cost",transactions:"Buy/sell history",summary:"Portfolio value over time + cash",wallet:"Currency-exchange FX rates"};
function readFileText(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsText(file); }); }

function PortfolioImport(){
  const app=useApp(); const base=app.meta.base_ccy||"NZD";
  const [slots,setSlots]=useState({}); // type -> {name, objects, count}
  const [unknown,setUnknown]=useState([]);
  const [clearDemo,setClearDemo]=useState(true);
  const [result,setResult]=useState(null); const [busy,setBusy]=useState(false); const [generic,setGeneric]=useState(false);
  const hasDemo=app.securities.some(s=>s.example);

  const ingest=(name,text)=>{
    const p=SH.parseCsv(text); const type=SH.detectReportType(p.headers);
    if(!type){ setUnknown(u=>[...u,name||"(pasted)"]); return; }
    setSlots(s=>({...s,[type]:{name:name||"(pasted)",objects:p.objects,count:p.objects.length}}));
  };
  const onFiles=async(list)=>{ setResult(null); for(const f of Array.from(list||[])){ try{ ingest(f.name,await readFileText(f)); }catch(e){ setUnknown(u=>[...u,f.name+" (read error)"]); } } };

  const preview=useMemo(()=>{
    if(!slots.holdings)return null;
    const cat={holdings:slots.holdings.objects,transactions:(slots.transactions||{}).objects||null,summary:(slots.summary||{}).objects||null,wallet:(slots.wallet||{}).objects||null};
    try{ return SH.buildImport(cat,{baseCcy:base}); }catch(e){ return {error:(e&&e.message)||"parse error",securities:[]}; }
  },[slots,base]);

  const previewTotal=useMemo(()=>{
    if(!preview||!preview.securities)return 0; const fx=(preview.metaPatch&&preview.metaPatch.fx)||{};
    return preview.securities.reduce((a,s)=>a+((num(s.holding.quantity)||0)*(num(s.price.current)||0)*(num(s.holding.fx_rate)||num(fx[s.currency])||(s.currency===base?1:0))),0);
  },[preview,base]);

  const doImport=async()=>{
    if(!preview||!preview.securities.length)return; setBusy(true);
    const n=await app.bulkImport(preview,clearDemo);
    setResult({count:n,total:previewTotal}); setBusy(false); app.notify("Imported "+n+" holdings");
  };

  if(generic)return html`<${GenericCsvImport} onBack=${()=>setGeneric(false)}/>`;

  return html`<div class="stack">
    <button class="link-btn small row" onClick=${()=>go("/portfolio")}>${icons.back()} Portfolio</button>
    <div class="pagehead"><div class="t"><h1>Import from Sharesies</h1><span class="muted">Drop your four exports — each is detected automatically</span></div></div>

    <div class="card pad stack">
      <label class="f" style=${{cursor:"pointer"}}>
        <div class="banner" style=${{textAlign:"center",borderStyle:"dashed"}}>
          <b>Choose CSV files</b><div class="xs muted">wallet · transaction · investment holdings · holdings summary — add any or all</div>
        </div>
        <input type="file" accept=".csv,text/csv" multiple style=${{display:"none"}} onChange=${e=>onFiles(e.target.files)}/>
      </label>
      <details><summary class="small muted" style=${{cursor:"pointer"}}>…or paste one report's CSV text</summary>
        <${PasteBox} onSubmit=${t=>ingest("(pasted)",t)}/>
      </details>
    </div>

    <div class="grid" style=${{gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))"}}>
      ${["holdings","transactions","summary","wallet"].map(t=>{const sl=slots[t];return html`<div key=${t} class="card pad-sm" style=${{borderColor:sl?"var(--pounamu-2)":"var(--hair)"}}>
        <div class="between"><b class="small">${SLOT_LABELS[t]}</b>${sl?html`<${Chip} kind="good">Loaded</${Chip}>`:html`<${Chip} kind="unknown">Waiting</${Chip}>`}</div>
        <div class="xs muted">${SLOT_ROLE[t]}</div>
        ${sl&&html`<div class="xs mono" style=${{marginTop:"4px"}}>${sl.name} · ${sl.count} rows</div>`}
        ${t==="holdings"&&!sl&&html`<div class="xs" style=${{color:"var(--kowhai)",marginTop:"4px"}}>Required for positions</div>`}
      </div>`;})}
    </div>
    ${unknown.length>0&&html`<div class="banner warn small">Not recognised as a Sharesies report: ${unknown.join(", ")}. <button class="link-btn" onClick=${()=>setUnknown([])}>dismiss</button></div>`}

    ${preview&&preview.error&&html`<div class="banner bad small">Could not parse: ${preview.error}</div>`}
    ${preview&&!preview.error&&html`<div class="card pad stack">
      <h3>Preview</h3>
      <div class="wrap-row">
        <${Chip} kind="solid">${preview.securities.length} current holdings</${Chip}>
        <${Chip} kind="neutral">≈ ${fmtMoney(previewTotal,base,0)}</${Chip}>
        ${preview.metaPatch&&preview.metaPatch.fx&&(preview.metaPatch.fx.USD||preview.metaPatch.fx.AUD)&&html`<${Chip} kind="neutral">FX ${Object.keys(preview.metaPatch.fx).filter(c=>c!==base).map(c=>c+" "+fmtNum(preview.metaPatch.fx[c],3)).join(" · ")}</${Chip}>`}
        ${preview.metaPatch&&preview.metaPatch.portfolio_history&&html`<${Chip} kind="neutral">${preview.metaPatch.portfolio_history.length}-pt value history</${Chip}>`}
      </div>
      <div class="scroll-x"><table class="tbl"><thead><tr><th>Ticker</th><th>Name</th><th>Qty</th><th>Price</th><th>Avg cost</th><th>Value (${base})</th></tr></thead><tbody>
        ${preview.securities.slice().sort((a,b)=>(b.holding.quantity*b.price.current*(b.holding.fx_rate||1))-(a.holding.quantity*a.price.current*(a.holding.fx_rate||1))).map((s,i)=>html`<tr key=${i}>
          <td><b class="mono">${s.exchange}:${s.ticker}</b></td><td class="small">${s.name}</td>
          <td class="mono">${fmtNum(s.holding.quantity,2)}</td><td class="mono">${fmtMoney(s.price.current,s.currency,2)}</td>
          <td class="mono">${s.holding.avg_cost!=null?fmtMoney(s.holding.avg_cost,s.currency,2):"—"}</td>
          <td class="mono">${fmtMoney((s.holding.quantity||0)*(s.price.current||0)*(s.holding.fx_rate||1),base,0)}</td></tr>`)}
      </tbody></table></div>
      ${hasDemo&&html`<label class="row small"><input type="checkbox" checked=${clearDemo} onChange=${e=>setClearDemo(e.target.checked)}/> Clear the demo securities (GOOGL/RMD/XRO examples) before importing</label>`}
      <div class="between"><span class="xs muted">Only current holdings (Ending shareholding &gt; 0) are imported. Prices show freshness “Latest reported”.</span>
        <button class="btn" disabled=${busy||!preview.securities.length} onClick=${doImport}>${busy?"Importing…":"Import "+preview.securities.length+" holdings"}</button></div>
    </div>`}

    ${result&&html`<div class="banner"><b>Imported ${result.count} holdings (${fmtMoney(result.total,base,0)}).</b> <button class="link-btn" onClick=${()=>go("/portfolio")}>View portfolio →</button></div>`}

    <div class="xs muted">Different broker? <button class="link-btn" onClick=${()=>setGeneric(true)}>Use the generic CSV mapper</button>.</div>
  </div>`;
}
function PasteBox({onSubmit}){ const [t,setT]=useState("");
  return html`<div class="stack" style=${{marginTop:"8px"}}>
    <textarea value=${t} onInput=${e=>setT(e.target.value)} style=${{minHeight:"90px",fontFamily:"var(--mono)",fontSize:".78rem",padding:"8px",border:"1px solid var(--hair-2)",borderRadius:"8px",background:"var(--raise)",color:"var(--ink)"}} placeholder="Paste the full CSV including its header row"></textarea>
    <div><button class="btn sm ghost" disabled=${!t.trim()} onClick=${()=>{onSubmit(t);setT("");}}>Detect & add</button></div>

}
/* generic single-CSV mapper (other brokers) */
function GenericCsvImport({onBack}){
  const app=useApp(); const [raw,setRaw]=useState(""); const [parsed,setParsed]=useState(null); const [map,setMap]=useState({}); const [done,setDone]=useState(null);
  const parse=(text)=>{ const p=SH.parseCsv(text); if(!p.headers.length){setParsed(null);return;} setParsed({headers:p.headers,rows:p.rows});
    const find=(...ks)=>p.headers.findIndex(h=>ks.some(k=>h.toLowerCase().includes(k)));
    setMap({ticker:find("ticker","symbol","code"),exchange:find("exchange","market"),quantity:find("qty","quantity","units","shares"),avg_cost:find("cost","avg","price"),currency:find("currency","ccy")}); };
  const doImport=async()=>{ const {rows}=parsed; let n=0; for(const r of rows){ const get=(k)=>map[k]>=0?r[map[k]]:""; const ticker=(get("ticker")||"").toUpperCase(); if(!ticker)continue; const exchange=(get("exchange")||"OTHER").toUpperCase();
    const existing=app.securities.find(x=>x.ticker===ticker&&(x.exchange===exchange||map.exchange<0)); const ccy=(get("currency")||"USD").toUpperCase();
    const rec=existing?{...existing}:{ticker,exchange,asset_type:"STOCK",currency:ccy,watchlist:false};
    rec.holding={quantity:num(get("quantity")),avg_cost:num(get("avg_cost")),currency:ccy,fx_rate:ccy===(app.meta.base_ccy||"NZD")?1:(num(rec.holding&&rec.holding.fx_rate)||null)};
    await app.saveSecurity(rec); n++; } setDone(n); };
  const FIELDS=[["ticker","Ticker *"],["exchange","Exchange"],["quantity","Quantity"],["avg_cost","Avg cost"],["currency","Currency"]];
  return html`<div class="stack">
    <button class="link-btn small row" onClick=${onBack}>${icons.back()} Sharesies import</button>
    <div class="pagehead"><div class="t"><h1>Generic CSV import</h1><span class="muted">Map your broker's columns</span></div></div>
    <div class="card pad stack"><${Field} label="Paste CSV with a header row"><textarea value=${raw} onInput=${e=>{setRaw(e.target.value);parse(e.target.value);}} style=${{minHeight:"110px",fontFamily:"var(--mono)",fontSize:".8rem"}}></textarea></${Field}></div>
    ${parsed&&html`<div class="card pad stack"><h3>Map columns</h3><div class="form-grid">
      ${FIELDS.map(f=>html`<${Field} key=${f[0]} label=${f[1]}><select value=${map[f[0]]==null?-1:map[f[0]]} onChange=${e=>setMap(m=>({...m,[f[0]]:parseInt(e.target.value)}))}><option value="-1">— none —</option>${parsed.headers.map((h,i)=>html`<option key=${i} value=${i}>${h}</option>`)}</select></${Field}>`)}</div>
      <div class="between"><span class="xs muted">${parsed.rows.length} rows</span><button class="btn" disabled=${map.ticker==null||map.ticker<0} onClick=${doImport}>Import ${parsed.rows.length} rows</button></div></div>`}
    ${done!=null&&html`<div class="banner"><b>Imported ${done} holdings.</b> <button class="link-btn" onClick=${()=>go("/portfolio")}>View portfolio →</button></div>`}
  </div>`;
}

    ${list.length===0?html`<div class="card pad empty"><h3>No alerts</h3><p class="small">Alerts fire only for band crossings, >${((app.meta.move_threshold||0.05)*100)}% moves, material events, thesis-gate changes and gate flips.</p></div>`:

/* ============================================================ Research */
function Research(){
  const app=useApp();
  const modes=[["QUICK_SCREEN","Quick screen","Fast triage of a new idea"],["FULL_ASSESSMENT","Full assessment","Complete framework scorecard + market context"],["THESIS_UPDATE","Thesis update","Revise thesis and falsifiers"],["RED_TEAM","Red-team","Attack the thesis"],["EVENT_REASSESSMENT","Event reassessment","Re-score after a material event"],["WATCHLIST_REVIEW","Watchlist review","Re-rank what you're tracking"],["PORTFOLIO_REVIEW","Portfolio review","Monthly liquidity / flow review"],["SECTOR_THEME_RESEARCH","Sector / theme","Top-down theme work"]];
  return html`<div class="stack">
    <div class="pagehead"><div class="t"><h1>Research</h1><span class="muted">Modes share one evidence store</span></div></div>
    <div class="grid" style=${{gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))"}}>
      ${modes.map(m=>html`<div key=${m[0]} class="card pad stack" style=${{gap:"6px"}}><div class="tag">${m[0].replace(/_/g," ")}</div><h3>${m[1]}</h3><p class="small muted" style=${{margin:0}}>${m[2]}</p>

/* ============================================================ Framework */

  return html`<div class="stack">
    <div class="pagehead"><div class="between"><div class="t"><h1>Framework</h1><span class="reo">Kawa</span></div><button class="btn ghost sm" onClick=${()=>setEdit(true)}>Edit weights → new version</button></div></div>
    <div class="banner small">Framework rules are versioned data, never hard-coded. Editing weights or gates creates a new version; historical analyses keep the version they were scored under.</div>
    <div class="card pad stack"><div class="between"><h3>Profile B — Quality / Entry overlay</h3><span class="tag">v${b.version} · active</span></div>
      <div class="scroll-x"><table class="tbl"><thead><tr><th>Dimension</th><th>Weight</th><th>Purpose</th></tr></thead><tbody>${(b.dimensions||[]).map(d=>html`<tr key=${d.key}><td><b>${d.label}</b></td><td class="mono">${d.weight}</td><td class="small muted">${d.purpose}</td></tr>`)}</tbody></table></div>

    <div class="card pad stack"><h3>Hard gates</h3><div class="stack" style=${{gap:"2px"}}>${(b.gates||[]).map(g=>html`<div key=${g.key} class="small" style=${{padding:"5px 0",borderBottom:"1px solid var(--hair)"}}>${g.label}</div>`)}</div>
      <div class="xs muted">A failed quality gate cannot be rescued by cheap price or favourable market context.</div></div>
    ${a&&html`<div class="card pad stack"><div class="between"><h3>Profile A — Core 40-point scorecard</h3><span class="tag">v${a.version}</span></div>
      <div class="scroll-x"><table class="tbl"><thead><tr><th>Category</th><th>Max</th></tr></thead><tbody>${(a.core_categories||[]).map(c=>html`<tr key=${c.key}><td>${c.label}</td><td class="mono">${c.max}</td></tr>`)}<tr><td><b>Total</b></td><td class="mono"><b>40</b></td></tr></tbody></table></div>
      <div class="small muted">If trading OR underlying liquidity &lt; 2 → HIGH_LIQUIDITY_RISK regardless of total.</div></div>`}
    <div class="card pad stack"><h3>Investment Kawa</h3><ol class="small" style=${{margin:0,paddingLeft:"18px",lineHeight:1.7}}>${KAWA.map((k,i)=>html`<li key=${i}>${k}</li>`)}</ol></div>
    ${versionsB.length>1&&html`<div class="card pad stack"><h3>Version history</h3>${versionsB.map(v=>html`<div key=${v.id} class="between small" style=${{padding:"5px 0",borderBottom:"1px solid var(--hair)"}}><span>v${v.version}${v.id===app.meta.active_fw?" · active":""}</span><span class="xs muted">${fmtDate(v.created_at)}</span></div>`)}</div>`}
    ${edit&&html`<${FrameworkEdit} base=${b} onClose=${()=>setEdit(false)}/>`}
  </div>`;
}
function FrameworkEdit({base,onClose}){
  const app=useApp(); const [dims,setDims]=useState(clone(base.dimensions||PROFILE_B_DIMS)); const [thr,setThr]=useState(base.quality_high_threshold||60);
  const save=async()=>{
    const {next}=VZ.nextFrameworkVersion(base,{dimensions:dims,quality_high_threshold:num(thr)},uid());
    // supersede old active
    await app.saveFramework(VZ.supersede(base));
    await app.saveFramework(next);
    await app.updateMeta({active_fw:next.id});
    app.notify("New framework version v"+next.version+" saved"); onClose();
  };
  return html`<${Modal} title="Edit Profile B → new version" onClose=${onClose}>
    <div class="banner small" style=${{marginBottom:"10px"}}>Saving creates version ${(base.version||1)+1}. Existing snapshots keep their original version.</div>
    <div class="stack">${dims.map((d,i)=>html`<div key=${d.key} class="between"><span class="small">${d.label}</span><input inputmode="numeric" value=${d.weight} onInput=${e=>setDims(ds=>ds.map((x,j)=>j===i?{...x,weight:num(e.target.value)||0}:x))} style=${{width:"80px",padding:"6px",border:"1px solid var(--hair-2)",borderRadius:"7px",background:"var(--raise)",color:"var(--ink)",textAlign:"right",fontFamily:"var(--mono)"}}/></div>`)}
      <${Field} label="Quality HIGH threshold (0–100, for decision zone)"><input inputmode="numeric" value=${thr} onInput=${e=>setThr(e.target.value)}/></${Field}>
      <div class="between"><span class="xs muted">Weights are normalised at scoring time.</span><button class="btn" onClick=${save}>Save new version</button></div>
    </div>
  </${Modal}>`;
}

function makeHistory(cur){ const h=[];let p=cur*1.12;const start=new Date(Date.now()-120*86400000);for(let i=0;i<=24;i++){p=p+(cur-p)*0.09+(Math.sin(i)*cur*0.012);const d=new Date(start.getTime()+i*5*86400000);h.push({date:d.toISOString().slice(0,10),close:Math.round(p*100)/100});}h.push({date:todayKey(),close:cur});return h; }
